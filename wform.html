<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер с динамическим цветом</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
        }

        .player-card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 850px; 
        }

        h2 { color: #ae5f9d; margin-top: 0; font-weight: 400; font-size: 1.6rem; margin-bottom: 5px; }
        .artist { color: #888; display: block; margin-bottom: 25px; font-size: 0.9rem; }

        .waveform-container {
            position: relative; 
            margin-bottom: 30px; 
            background: #fafafa;
        }

        #waveform { height: 100px; }

        #progress-tip {
            position: absolute;
            z-index: 15;
            top: 50%;
            transform: translateY(-50%);
            background: #333; 
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            left: 0; 
            transition: left 0.1s linear; 
        }

        #progress-line {
            position: absolute;
            z-index: 14;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #333;
            left: 0;
            transition: left 0.1s linear;
        }

        #hover-time {
            position: absolute;
            z-index: 20;
            top: 20px;
            background: rgba(174, 95, 157, 0.8); 
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            display: none;
            pointer-events: none;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        button { 
            background: #ae5f9d; 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
            min-width: 130px;
        }

        .time-box { color: #888; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Фонограма - Такий великий Бог!</h2>
    <span class="artist">Ярина Вислоцька</span>
    
    <div class="waveform-container" id="waveform-outer">
        <div id="waveform"></div>
        <div id="progress-line"></div>
        <div id="progress-tip">00:00</div>
        <div id="hover-time">00:00</div>
    </div>
    
    <div class="controls">
        <button id="playPause">Воспроизвести</button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#e0e0e0',
        progressColor: '#ae5f9d',
        barWidth: 1,    
        barGap: 1,      
        height: 100,
        responsive: true,
        normalize: true,
        cursorWidth: 0 
    });

    wavesurfer.load('2023100117595272.mp3');

    const progressTip = document.getElementById('progress-tip');
    const progressLine = document.getElementById('progress-line');
    const hoverTime = document.getElementById('hover-time');
    const outer = document.getElementById('waveform-outer');
    const btn = document.getElementById('playPause');

    const formatTime = (s) => isNaN(s) ? "00:00" : new Date(s * 1000).toISOString().substr(14, 5);

    // --- ЛОГИКА АНАЛИЗА ЗВУКА ---
    let audioContext, analyser, dataArray;

    const initAudioAnalysis = () => {
        if (audioContext) return; // Чтобы не инициализировать дважды
        
        audioContext = wavesurfer.backend.getAudioContext();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 32; // Маленький размер для быстрой реакции
        
        const source = wavesurfer.backend.source;
        if (source) {
            source.connect(analyser);
        }

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        animateColor();
    };

    const animateColor = () => {
        if (!wavesurfer.isPlaying()) {
            requestAnimationFrame(animateColor);
            return;
        }

        analyser.getByteFrequencyData(dataArray);
        
        // Считаем среднюю громкость
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        let average = sum / dataArray.length;

        // Вычисляем цвет: от фиолетового (#ae5f9d) до ярко-розового или красного
        // Чем выше громкость, тем больше смещение в сторону яркости
        const intensity = Math.min(average / 128, 1); 
        const r = Math.floor(174 + (81 * intensity)); // Изменяем каналы
        const g = Math.floor(95 - (50 * intensity));
        const b = Math.floor(157 + (50 * intensity));

        const newColor = `rgb(${r}, ${g}, ${b})`;
        wavesurfer.setOptions({ progressColor: newColor });

        requestAnimationFrame(animateColor);
    };

    // --- ОСНОВНЫЕ СОБЫТИЯ ---
    const updateProgressUI = () => {
        const currentTime = wavesurfer.getCurrentTime();
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            const progress = (currentTime / duration) * 100;
            progressTip.style.left = `calc(${progress}% - ${progressTip.offsetWidth / 2}px)`;
            progressLine.style.left = `${progress}%`;
            progressTip.textContent = formatTime(currentTime);
            document.getElementById('currentTime').textContent = formatTime(currentTime);
        }
    };

    wavesurfer.on('audioprocess', updateProgressUI);
    wavesurfer.on('seek', updateProgressUI);
    wavesurfer.on('ready', () => {
        document.getElementById('totalDuration').textContent = formatTime(wavesurfer.getDuration());
    });

    wavesurfer.on('play', () => {
        initAudioAnalysis();
        btn.textContent = 'Пауза';
    });
    
    wavesurfer.on('pause', () => btn.textContent = 'Воспроизвести');

    outer.onmousemove = (e) => {
        const rect = outer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = x / rect.width;
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            hoverTime.style.display = 'block';
            hoverTime.style.left = `${x - (hoverTime.offsetWidth / 2)}px`;
            hoverTime.textContent = formatTime(duration * ratio);
        }
    };

    outer.onmouseleave = () => hoverTime.style.display = 'none';
    btn.onclick = () => wavesurfer.playPause();
</script>

</body>
</html>
