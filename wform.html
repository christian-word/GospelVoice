<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеєр - Такий великий Бог!</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #fafafa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        .player-card { 
            background: white; 
            padding: 30px; 
            border: 1px solid #eaeaea;
            border-radius: 12px; 
            width: 100%; 
            max-width: 950px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        /* Обновленный заголовок в стиле скриншота */
        h2 { 
            color: #ae5f9d; 
            margin: 0; 
            font-weight: 300; 
            font-size: 2.2rem; 
            letter-spacing: -0.5px;
        }
        
        #current-artist { 
            color: #999; 
            font-size: 0.95rem; 
            display: block; 
            margin-bottom: 25px; 
            font-weight: 400;
        }

        .main-row {
            display: flex;
            align-items: center;
            gap: 25px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        /* Обновленная обложка в стиле скриншота */
        .cover-wrapper {
            position: relative;
            width: 85px;
            height: 85px;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            background: linear-gradient(135deg, #7e57c2, #ff7043); /* Градиент как на скрине */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .cover-wrapper:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(126, 87, 194, 0.3);
        }

        /* Иконка микрофона */
        .cover-wrapper::before {
            content: '🎤';
            font-size: 36px;
            opacity: 0.5;
            color: white;
        }

        /* Кнопка Play/Pause внутри обложки */
        #playPause {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 18px;
            z-index: 5;
            outline: none;
        }

        #playPause:hover { background: rgba(255, 255, 255, 0.5); }

        /* Контейнер для волны (с запасом под отражение) */
        .waveform-container {
            flex-grow: 1;
            position: relative;
            height: 120px; /* Увеличил высоту для отражения */
            background: #fbfbfb;
            border-radius: 6px;
        }

        #waveform { height: 120px; }

        /* Обновленный "progress-tip" в стиле скриншота */
        #progress-tip {
            position: absolute;
            z-index: 15;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.8); /* Черный, полупрозрачный */
            color: white;
            padding: 4px 8px;
            border-radius: 4px; /* Скругление */
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            left: 0;
            transition: left 0.1s linear;
        }

        #progress-line {
            position: absolute;
            z-index: 14;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #333;
            left: 0;
            transition: left 0.1s linear;
        }

        /* СПИСОК ТРЕКОВ */
        .playlist {
            margin-top: 30px;
            border-top: 1px dashed #eee;
            padding-top: 20px;
        }

        .track-item {
            padding: 12px 15px;
            margin: 6px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #555;
            display: flex;
            justify-content: space-between;
            transition: background 0.2s, color 0.2s;
        }

        .track-item:hover { background: #fcfcfc; }
        .track-item.active { 
            background: #fdf5f9; 
            color: #ae5f9d; 
            font-weight: 600; 
            border-left: 4px solid #ae5f9d;
        }

        /* ОБНОВЛЕННЫЕ МЕТАДАННЫЕ В СТИЛЕ СКРИНШОТА */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            flex-wrap: wrap;
            gap: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .meta-info {
            display: flex;
            gap: 25px;
            font-size: 13px;
            color: #999;
            align-items: center;
        }

        .meta-item { display: flex; align-items: center; gap: 7px; }
        .meta-item span.icon { font-size: 16px; opacity: 0.7; }

        .source-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .source-link:hover { transform: translateY(-2px); }
        .source-link img { height: 26px; margin-right: 12px; display: block; }
        .source-link span { font-size: 15px; color: #333; font-weight: 700; letter-spacing: 0.5px; }
    </style>
</head>
<body>

<div class="player-card">
    <h2 id="current-title">Фонограма - Такий великий Бог!</h2>
    <span id="current-artist" class="artist">Християнська музика</span>
    
    <div class="main-row">
        <div class="cover-wrapper" id="coverBtn">
            <button id="playPause">▶</button>
        </div>

        <div class="waveform-container" id="waveform-outer">
            <div id="waveform"></div>
            <div id="progress-line"></div>
            <div id="progress-tip">00:00</div>
        </div>
    </div>

    <div class="playlist" id="playlist">
        <div class="track-item active" data-src="2023100117595272.mp3" data-title="Фонограма - Такий великий Бог!" data-artist="Християнська музика">
            <span>1. Ярина Вислоцька (мінус)</span>
            <span>6.13 MB</span>
        </div>
        <div class="track-item" data-src="RGDyHUJ2mf0xNfWK9HyjQhi5NCy4QpvlvHZETsxO.mp3" data-title="Такий великий Бог!" data-artist="Християнська музика">
            <span>2. Сім'я Денисюків</span>
            <span>MP3</span>
        </div>
    </div>

    <div class="footer-row">
        <div class="meta-info">
            <div class="meta-item"><span class="icon">〰</span>мінус</div>
            <div class="meta-item"><span class="icon">💾</span>6.13 MB / 192 кбіт/с</div>
            <div class="meta-item"><span class="icon">👤</span>Yuriy</div>
        </div>

        <a href="https://fonki.pro/minus/9718" target="_blank" class="source-link">
            <img src="https://fonki.pro/assets/img/logo.png" alt="FONKI.PRO">
            <span>FONKI.PRO</span>
        </a>
    </div>
</div>

<script>
    // Обновленные настройки Wavesurfer для стиля скриншота
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#e0e0e0', // Светло-серый для неактивной части
        progressColor: '#ae5f9d', // Твой фиолетовый
        barWidth: 3,          // Столбцы шире
        barRadius: 2,         // Скругленные углы столбцов
        barGap: 1,            // Небольшой отступ
        height: 80,           // Основная высота волны
        responsive: true,
        normalize: true,
        cursorWidth: 0,
        reflection: true,     // ВКЛЮЧАЕМ ОТРАЖЕНИЕ
        reflectionOpacity: 0.3 // Прозрачность отражения
    });

    const progressTip = document.getElementById('progress-tip');
    const progressLine = document.getElementById('progress-line');
    const titleEl = document.getElementById('current-title');
    const artistEl = document.getElementById('current-artist');
    const formatTime = (s) => new Date(s * 1000).toISOString().substr(14, 5);

    const updateUI = () => {
        const currentTime = wavesurfer.getCurrentTime();
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            const progress = (currentTime / duration) * 100;
            progressTip.style.left = `calc(${progress}% - ${progressTip.offsetWidth / 2}px)`;
            progressLine.style.left = `${progress}%`;
            progressTip.textContent = formatTime(currentTime);
        }
    };

    wavesurfer.on('audioprocess', updateUI);
    wavesurfer.on('seek', updateUI);
    wavesurfer.on('ready', updateUI);

    const btn = document.getElementById('playPause');
    const cover = document.getElementById('coverBtn');

    const togglePlay = () => wavesurfer.playPause();
    btn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
    cover.onclick = togglePlay;

    wavesurfer.on('play', () => btn.innerHTML = '▌▌'); 
    wavesurfer.on('pause', () => btn.innerHTML = '▶');

    // Логика плейлиста
    const trackItems = document.querySelectorAll('.track-item');
    
    trackItems.forEach(item => {
        item.onclick = () => {
            // Убираем активный класс у всех
            trackItems.forEach(i => i.classList.remove('active'));
            // Добавляем текущему
            item.classList.add('active');
            
            // Меняем текст в плеере
            titleEl.textContent = item.getAttribute('data-title');
            artistEl.textContent = item.getAttribute('data-artist');
            
            // Загружаем новый трек
            wavesurfer.load(item.getAttribute('data-src'));
            wavesurfer.once('ready', () => wavesurfer.play());
        };
    });

    // Загрузка первого трека при старте
    wavesurfer.load('2023100117595272.mp3');
</script>

</body>
</html>
