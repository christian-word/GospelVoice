<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финальный Аудио Плеер</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #fdfdfd; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
        }

        .player-card { 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            border: 1px solid #e0e0e0;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            max-width: 900px; 
        }

        h2 { 
            color: #ae5f9d; 
            font-weight: 300; 
            font-size: 1.8rem; 
            margin: 0 0 20px 0;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .waveform-container {
            position: relative; 
            margin-bottom: 25px; 
            background: transparent;
        }

        #waveform { height: 120px; }

        /* Черный индикатор прогресса (плашка с временем) */
        #progress-tip {
            position: absolute;
            z-index: 15;
            top: 50%;
            transform: translateY(-50%);
            background: #222; 
            color: white;
            padding: 2px 6px;
            border-radius: 2px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            pointer-events: none;
            transition: left 0.05s linear;
        }

        /* Тонкая черная линия под плашкой */
        #progress-line {
            position: absolute;
            z-index: 14;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #222;
            transition: left 0.05s linear;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 20px;
        }

        button { 
            background: #ae5f9d; 
            color: white; 
            border: none; 
            padding: 8px 20px; 
            border-radius: 3px; 
            cursor: pointer; 
            font-size: 14px;
            transition: background 0.2s;
        }

        button:hover { background: #8e4d80; }

        .time-box { 
            color: #999; 
            font-family: monospace; 
            font-size: 14px; 
        }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Фонограма - Такий великий Бог!</h2>
    <span class="artist">Ярина Вислоцька</span>
    
    <div class="waveform-container" id="waveform-outer">
        <div id="waveform"></div>
        <div id="progress-line"></div>
        <div id="progress-tip">00:00</div>
    </div>
    
    <div class="controls">
        <button id="playPause">Воспроизвести</button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#dcdcdc',
        progressColor: '#ae5f9d',
        
        // Настройки плотности (как просили)
        barWidth: 1,  /* Толщина полоски 1 пиксель */
        barGap: 1,    /* Расстояние 1 пиксель */
        
        height: 120,
        responsive: true,
        normalize: true,
        cursorWidth: 0,
        backend: 'WebAudio'
    });

    wavesurfer.load('2023100117595272.mp3');

    const progressTip = document.getElementById('progress-tip');
    const progressLine = document.getElementById('progress-line');

    const formatTime = (s) => {
        if (isNaN(s)) return "00:00";
        const mins = Math.floor(s / 60);
        const secs = Math.floor(s % 60);
        return mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
    };

    const updateUI = () => {
        const current = wavesurfer.getCurrentTime();
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            const pos = (current / duration) * 100;
            progressLine.style.left = pos + '%';
            // Смещение плашки, чтобы она была по центру линии
            progressTip.style.left = `calc(${pos}% - ${progressTip.offsetWidth / 2}px)`;
            progressTip.textContent = formatTime(current);
            document.getElementById('currentTime').textContent = formatTime(current);
        }
    };

    wavesurfer.on('audioprocess', updateUI);
    wavesurfer.on('seek', updateUI);
    wavesurfer.on('ready', () => {
        document.getElementById('totalDuration').textContent = formatTime(wavesurfer.getDuration());
        updateUI();
    });

    const btn = document.getElementById('playPause');
    btn.onclick = () => wavesurfer.playPause();
    wavesurfer.on('play', () => btn.textContent = 'Пауза');
    wavesurfer.on('pause', () => btn.textContent = 'Воспроизвести');
</script>

</body>
</html>
