<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер с живой волной</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
        }

        .player-card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 850px; 
        }

        h2 { color: #333; margin: 0 0 5px 0; font-weight: 600; font-size: 1.5rem; }
        .artist { color: #ae5f9d; display: block; margin-bottom: 25px; font-weight: 500; }

        .waveform-container {
            position: relative; 
            margin-bottom: 30px; 
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        #waveform { height: 120px; }

        /* ИНДИКАТОР ТЕКУЩЕЙ ПОЗИЦИИ */
        #progress-tip {
            position: absolute;
            z-index: 15;
            top: 50%;
            transform: translateY(-50%);
            background: #333; 
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            pointer-events: none;
            left: 0; 
            transition: left 0.1s linear; 
        }

        #progress-line {
            position: absolute;
            z-index: 14;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #333;
            left: 0;
            transition: left 0.1s linear;
        }

        /* ПОДСКАЗКА ПРИ НАВЕДЕНИИ */
        #hover-time {
            position: absolute;
            z-index: 20;
            top: 10px;
            background: rgba(51, 51, 51, 0.8); 
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            display: none;
            pointer-events: none;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 20px;
        }

        button { 
            background: #333; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
            min-width: 150px;
        }

        button:hover { background: #ae5f9d; }

        .time-box { color: #666; font-family: monospace; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Фонограма - Такий великий Бог!</h2>
    <span class="artist">Ярина Вислоцька</span>
    
    <div class="waveform-container" id="waveform-outer">
        <div id="waveform"></div>
        <div id="progress-line"></div>
        <div id="progress-tip">00:00</div>
        <div id="hover-time">00:00</div>
    </div>
    
    <div class="controls">
        <button id="playPause">Воспроизвести</button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#d1d1d1',
        progressColor: '#ae5f9d',
        barWidth: 1,    
        barGap: 1,      
        height: 120,
        responsive: true,
        normalize: true,
        cursorWidth: 0 
    });

    wavesurfer.load('2023100117595272.mp3');

    const progressTip = document.getElementById('progress-tip');
    const progressLine = document.getElementById('progress-line');
    const hoverTime = document.getElementById('hover-time');
    const outer = document.getElementById('waveform-outer');
    const btn = document.getElementById('playPause');

    const formatTime = (s) => isNaN(s) ? "00:00" : new Date(s * 1000).toISOString().substr(14, 5);

    // --- АНАЛИЗАТОР И ПУЛЬСАЦИЯ ЦВЕТА ---
    let audioContext, analyser, dataArray;

    const initAudioAnalysis = () => {
        if (audioContext) return;
        
        audioContext = wavesurfer.backend.getAudioContext();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64; 
        
        const source = wavesurfer.backend.source;
        if (source) source.connect(analyser);

        dataArray = new Uint8Array(analyser.frequencyBinCount);
        animateWave();
    };

    const animateWave = () => {
        if (wavesurfer.isPlaying()) {
            analyser.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let average = sum / dataArray.length;

            // Интенсивность (0.0 - 1.0)
            const v = Math.min(average / 100, 1); 

            // Цвета для "пройденной" части (от фиолетового до яркого неона)
            const pr = Math.floor(174 + (81 * v));
            const pg = Math.floor(95 + (160 * v));
            const pb = Math.floor(157 + (98 * v));

            // Цвета для "будущей" части (от серого до светло-фиолетового)
            const wr = Math.floor(200 - (50 * v));
            const wg = Math.floor(200 - (100 * v));
            const wb = Math.floor(200 + (55 * v));

            wavesurfer.setOptions({ 
                progressColor: `rgb(${pr}, ${pg}, ${pb})`,
                waveColor: `rgb(${wr}, ${wg}, ${wb})`
            });
        }
        requestAnimationFrame(animateWave);
    };

    // --- ЛОГИКА ИНТЕРФЕЙСА ---
    const updateProgressUI = () => {
        const currentTime = wavesurfer.getCurrentTime();
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            const progress = (currentTime / duration) * 100;
            progressTip.style.left = `calc(${progress}% - ${progressTip.offsetWidth / 2}px)`;
            progressLine.style.left = `${progress}%`;
            progressTip.textContent = formatTime(currentTime);
            document.getElementById('currentTime').textContent = formatTime(currentTime);
        }
    };

    wavesurfer.on('audioprocess', updateProgressUI);
    wavesurfer.on('seek', updateProgressUI);
    wavesurfer.on('ready', () => {
        document.getElementById('totalDuration').textContent = formatTime(wavesurfer.getDuration());
    });

    wavesurfer.on('play', () => {
        initAudioAnalysis();
        btn.textContent = 'Пауза';
    });
    wavesurfer.on('pause', () => btn.textContent = 'Воспроизвести');

    outer.onmousemove = (e) => {
        const rect = outer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = x / rect.width;
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            hoverTime.style.display = 'block';
            hoverTime.style.left = `${x - (hoverTime.offsetWidth / 2)}px`;
            hoverTime.textContent = formatTime(duration * ratio);
        }
    };

    outer.onmouseleave = () => hoverTime.style.display = 'none';
    btn.onclick = () => wavesurfer.playPause();
</script>

</body>
</html>
