<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер с активной цветовой индикацией</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
        }

        .player-card { 
            background: white; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 850px; 
        }

        h2 { color: #333; margin: 0 0 5px 0; font-weight: 600; font-size: 1.5rem; }
        .artist { color: #ae5f9d; display: block; margin-bottom: 25px; font-weight: 500; }

        .waveform-container {
            position: relative; 
            margin-bottom: 30px; 
            background: #fff;
            border-radius: 8px;
        }

        #waveform { height: 120px; }

        #progress-tip {
            position: absolute;
            z-index: 15;
            top: 50%;
            transform: translateY(-50%);
            background: #333; 
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
            pointer-events: none;
            left: 0; 
        }

        #progress-line {
            position: absolute;
            z-index: 14;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #333;
            left: 0;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 20px;
        }

        button { 
            background: #333; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 14px;
            font-weight: 600;
            min-width: 150px;
        }

        .time-box { color: #666; font-family: monospace; font-size: 15px; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Фонограма - Такий великий Бог!</h2>
    <span class="artist">Ярина Вислоцька</span>
    
    <div class="waveform-container" id="waveform-outer">
        <div id="waveform"></div>
        <div id="progress-line"></div>
        <div id="progress-tip">00:00</div>
    </div>
    
    <div class="controls">
        <button id="playPause">Воспроизвести</button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#d1d1d1',
        progressColor: '#ae5f9d',
        barWidth: 1,    
        barGap: 1,      
        height: 120,
        responsive: true,
        normalize: true,
        cursorWidth: 0,
        backend: 'WebAudio' // Принудительно используем WebAudio для анализа
    });

    wavesurfer.load('2023100117595272.mp3');

    const progressTip = document.getElementById('progress-tip');
    const progressLine = document.getElementById('progress-line');
    const btn = document.getElementById('playPause');

    let analyser, dataArray;

    const setupAnalyser = () => {
        const audioContext = wavesurfer.backend.getAudioContext();
        
        // Разблокировка аудио-контекста для Chrome
        if (audioContext.state === 'suspended') {
            audioContext.resume();
        }

        if (!analyser) {
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 32;
            wavesurfer.backend.analyze(analyser); // Подключаем анализатор напрямую
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            renderLoop();
        }
    };

    const renderLoop = () => {
        if (wavesurfer.isPlaying()) {
            analyser.getByteFrequencyData(dataArray);
            
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            let level = sum / dataArray.length;

            // Вычисляем яркость (0-1)
            let v = Math.min(level / 100, 1);

            // Меняем цвета: 
            // Progress: от фиолетового до ярко-малинового
            const pr = Math.floor(174 + (81 * v));
            const pg = Math.floor(95 - (40 * v));
            const pb = Math.floor(157 + (98 * v));

            // Wave: от светло-серого до синеватого
            const wr = Math.floor(209 - (50 * v));
            const wg = Math.floor(209 - (50 * v));
            const wb = Math.floor(209 + (46 * v));

            // Применяем настройки
            wavesurfer.setOptions({
                progressColor: `rgb(${pr}, ${pg}, ${pb})`,
                waveColor: `rgb(${wr}, ${wg}, ${wb})`
            });
        }
        requestAnimationFrame(renderLoop);
    };

    wavesurfer.on('play', () => {
        setupAnalyser();
        btn.textContent = 'Пауза';
    });
    
    wavesurfer.on('pause', () => btn.textContent = 'Воспроизвести');

    // Обновление позиции плашки
    const updateUI = () => {
        const time = wavesurfer.getCurrentTime();
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            const pos = (time / duration) * 100;
            progressLine.style.left = pos + '%';
            progressTip.style.left = `calc(${pos}% - ${progressTip.offsetWidth / 2}px)`;
            
            const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
            progressTip.textContent = fmt(time);
            document.getElementById('currentTime').textContent = fmt(time);
        }
    };

    wavesurfer.on('audioprocess', updateUI);
    wavesurfer.on('seek', updateUI);
    wavesurfer.on('ready', () => {
        const fmt = (s) => new Date(s * 1000).toISOString().substr(14, 5);
        document.getElementById('totalDuration').textContent = fmt(wavesurfer.getDuration());
    });

    btn.onclick = () => wavesurfer.playPause();
</script>

</body>
</html>
