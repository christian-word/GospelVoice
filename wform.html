<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Плеер с индикатором прогресса</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f8f9fa; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
        }

        .player-card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 850px; 
        }

        h2 { color: #ae5f9d; margin-top: 0; font-weight: 400; font-size: 1.6rem; margin-bottom: 25px; }

        .waveform-container {
            position: relative; 
            margin-bottom: 30px; 
            background: #fafafa;
        }

        #waveform { height: 100px; }

        /* ЧЕРНЫЙ КВАДРАТИК ПРОГРЕССА (КАК НА ФОТО) */
        #progress-tip {
            position: absolute;
            z-index: 15;
            top: 50%;
            transform: translateY(-50%);
            background: #333; /* Темный цвет как на фото */
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            left: 0; /* Будет меняться через JS */
            transition: left 0.1s linear; /* Плавность хода */
        }

        /* Тонкая вертикальная линия прогресса */
        #progress-line {
            position: absolute;
            z-index: 14;
            top: 0;
            bottom: 0;
            width: 1px;
            background: #333;
            left: 0;
            transition: left 0.1s linear;
        }

        /* КУРСОР ПРИ НАВЕДЕНИИ (ПОДСКАЗКА) */
        #hover-time {
            position: absolute;
            z-index: 20;
            top: 20px;
            background: rgba(174, 95, 157, 0.8); /* Сделал чуть светлее для отличия */
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 11px;
            display: none;
            pointer-events: none;
        }

        .controls { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
        }

        button { 
            background: #ae5f9d; 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
        }

        .time-box { color: #888; font-family: monospace; font-size: 14px; }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Фонограма - Такий великий Бог!</h2>
    <span class="artist">Ярина Вислоцька</span>
    
    <div class="waveform-container" id="waveform-outer">
        <div id="waveform"></div>
        
        <div id="progress-line"></div>
        <div id="progress-tip">00:00</div>
        
        <div id="hover-time">00:00</div>
    </div>
    
    <div class="controls">
        <button id="playPause">Воспроизвести</button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#e0e0e0',
        progressColor: '#ae5f9d',
        barWidth: 2,
        barGap: 3,
        height: 100,
        responsive: true,
        normalize: true,
        cursorWidth: 0 // Скрываем стандартный курсор
    });

    wavesurfer.load('2023100117595272.mp3');

    const progressTip = document.getElementById('progress-tip');
    const progressLine = document.getElementById('progress-line');
    const hoverTime = document.getElementById('hover-time');
    const outer = document.getElementById('waveform-outer');

    const formatTime = (s) => new Date(s * 1000).toISOString().substr(14, 5);

    // Функция обновления положения черного квадратика
    const updateProgressUI = () => {
        const currentTime = wavesurfer.getCurrentTime();
        const duration = wavesurfer.getDuration();
        if (duration > 0) {
            const progress = (currentTime / duration) * 100;
            
            // Двигаем линию и плашку
            progressTip.style.left = `calc(${progress}% - ${progressTip.offsetWidth / 2}px)`;
            progressLine.style.left = `${progress}%`;
            progressTip.textContent = formatTime(currentTime);
        }
    };

    // Обновляем при проигрывании
    wavesurfer.on('audioprocess', updateProgressUI);
    
    // Обновляем при клике (перемотке)
    wavesurfer.on('seek', updateProgressUI);

    wavesurfer.on('ready', () => {
        document.getElementById('totalDuration').textContent = formatTime(wavesurfer.getDuration());
        updateProgressUI();
    });

    // Логика наведения (hover)
    outer.onmousemove = (e) => {
        const rect = outer.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = x / rect.width;
        const time = wavesurfer.getDuration() * ratio;

        hoverTime.style.display = 'block';
        hoverTime.style.left = `${x - (hoverTime.offsetWidth / 2)}px`;
        hoverTime.textContent = formatTime(time);
    };

    outer.onmouseleave = () => hoverTime.style.display = 'none';

    // Кнопка
    const btn = document.getElementById('playPause');
    btn.onclick = () => wavesurfer.playPause();
    wavesurfer.on('play', () => btn.textContent = 'Пауза');
    wavesurfer.on('pause', () => btn.textContent = 'Воспроизвести');
</script>

</body>
</html>
