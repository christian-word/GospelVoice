<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый Аудио Плеер</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px;
            box-sizing: border-box;
        }

        .player-card { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 500px; 
            box-sizing: border-box;
            text-align: center; /* Центрируем всё содержимое внутри */
        }

        h2 { 
            color: #ae5f9d; 
            margin-top: 0; 
            font-weight: 500; 
            font-size: 1.1rem; 
            line-height: 1.4;
            margin-bottom: 20px;
        }

        #waveform { 
            margin-bottom: 20px; 
            background: #fafafa; 
            border-radius: 4px; 
        }

        .controls { 
            display: flex; 
            flex-direction: column; /* Элементы друг под другом для мобильных */
            align-items: center; 
            gap: 12px; 
        }

        /* Если экран шире 400px, ставим кнопку и время в ряд */
        @media (min-width: 400px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        button { 
            background: #ae5f9d; 
            color: white; 
            border: none; 
            padding: 10px 25px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 14px; 
            transition: 0.3s;
            width: auto; /* Кнопка не растягивается */
        }

        button:hover { background: #8e4d80; }

        .time-box { 
            color: #666; 
            font-family: monospace; 
            font-size: 14px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Фонограмма (Такий великий Бог-Ярина Вислоцька)</h2>
    <div id="waveform"></div>
    
    <div class="controls">
        <button id="playPause">Воспроизвести</button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#dcdcdc',
        progressColor: '#ae5f9d',
        barWidth: 2,
        barGap: 2,
        barRadius: 3,
        height: 90,
        responsive: true,
        normalize: true,
        cursorColor: 'transparent'
    });

    const audioUrl = '2023100117595272.mp3';
    wavesurfer.load(audioUrl);

    const btn = document.getElementById('playPause');
    btn.onclick = () => wavesurfer.playPause();

    wavesurfer.on('play', () => btn.textContent = 'Пауза');
    wavesurfer.on('pause', () => btn.textContent = 'Воспроизвести');

    const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };
    
    wavesurfer.on('ready', () => {
        document.getElementById('totalDuration').textContent = formatTime(wavesurfer.getDuration());
    });

    wavesurfer.on('audioprocess', () => {
        document.getElementById('currentTime').textContent = formatTime(wavesurfer.getCurrentTime());
    });

    wavesurfer.on('seek', () => {
        document.getElementById('currentTime').textContent = formatTime(wavesurfer.getCurrentTime());
    });
</script>

</body>
</html>
