<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Современный Аудио Плеер</title>
    <script src="https://unpkg.com/wavesurfer.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; }

        body { 
            font-family: 'Poppins', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            /* Стильный градиентный фон */
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-card { 
            background: rgba(255, 255, 255, 0.9); /* Полупрозрачность */
            padding: 30px; 
            border-radius: 20px; 
            /* Тень и эффект размытия (Glassmorphism) */
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            
            width: 100%; 
            max-width: 550px; 
            text-align: center;
            animation: fadeIn 0.8s ease-out; /* Применяем анимацию */
        }

        h2 { 
            color: #333; 
            margin-top: 0; 
            font-weight: 600; 
            font-size: 1.2rem; 
            line-height: 1.4;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .artist {
            color: #ae5f9d;
            font-size: 0.9rem;
            margin-bottom: 25px;
            display: block;
            font-weight: 400;
        }

        #waveform { 
            margin-bottom: 25px; 
            background: rgba(0,0,0,0.01);
            border-radius: 8px; 
            overflow: hidden; /* Чтобы волна не вылезала за радиус */
            position: relative;
        }
        
        /* Тонкая линия под волной */
        #waveform::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(0,0,0,0.05);
        }

        .controls { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 15px; 
        }

        /* Адаптив для контролов */
        @media (min-width: 450px) {
            .controls {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        button { 
            /* Градиентная кнопка */
            background: linear-gradient(135deg, #ae5f9d 0%, #8e4d80 100%);
            color: white; 
            border: none; 
            padding: 12px 28px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-size: 15px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px; /* Отступ между иконкой и текстом */
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(174, 95, 157, 0.3);
            width: auto;
        }

        button:hover { 
            background: linear-gradient(135deg, #bd70ac 0%, #9e5a8f 100%);
            box-shadow: 0 6px 20px rgba(174, 95, 157, 0.4);
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(1px);
            box-shadow: 0 2px 10px rgba(174, 95, 157, 0.3);
        }

        .time-box { 
            color: #777; 
            font-family: 'Roboto Mono', monospace; /* Моноширинный шрифт для цифр */
            font-size: 14px;
            white-space: nowrap;
            background: rgba(0,0,0,0.04);
            padding: 6px 14px;
            border-radius: 20px;
        }
        
        #currentTime {
            color: #ae5f9d; /* Текущее время выделено цветом */
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="player-card">
    <h2>Такий великий Бог!</h2>
    <span class="artist">Ярина Вислоцька</span>
    
    <div id="waveform"></div>
    
    <div class="controls">
        <button id="playPause">
            <i class="fas fa-play" id="playIcon"></i> <span id="btnText">Воспроизвести</span>
        </button>
        <div class="time-box">
            <span id="currentTime">00:00</span> / <span id="totalDuration">00:00</span>
        </div>
    </div>
</div>

<script>
    const wavesurfer = WaveSurfer.create({
        container: '#waveform',
        waveColor: '#e0e0e0',      /* Более светлая базовая волна */
        progressColor: '#ae5f9d',  /* Насыщенный цвет прогресса */
        barWidth: 2,               /* Тонкие бары */
        barGap: 3,                 /* Чуть больше отступ */
        barRadius: 3,
        height: 70,                /* Компактная высота */
        responsive: true,
        normalize: true,
        cursorColor: '#8e4d80',    /* Цвет курсора */
        cursorWidth: 2
    });

    // Укажите ваш аудиофайл
    const audioUrl = '2023100117595272.mp3';
    wavesurfer.load(audioUrl);

    const btn = document.getElementById('playPause');
    const btnIcon = document.getElementById('playIcon');
    const btnText = document.getElementById('btnText');

    btn.onclick = () => wavesurfer.playPause();

    // Обновление кнопки и иконки
    wavesurfer.on('play', () => {
        btnIcon.className = 'fas fa-pause';
        btnText.textContent = 'Пауза';
    });

    wavesurfer.on('pause', () => {
        btnIcon.className = 'fas fa-play';
        btnText.textContent = 'Воспроизвести';
    });

    // Форматирование времени
    const formatTime = (seconds) => {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };
    
    wavesurfer.on('ready', () => {
        document.getElementById('totalDuration').textContent = formatTime(wavesurfer.getDuration());
    });

    wavesurfer.on('audioprocess', () => {
        document.getElementById('currentTime').textContent = formatTime(wavesurfer.getCurrentTime());
    });

    wavesurfer.on('seek', () => {
        document.getElementById('currentTime').textContent = formatTime(wavesurfer.getCurrentTime());
    });
</script>

</body>
</html>
